name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run checkpoint tests (CP1–CP4)
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        # CP5 gọi vào bản deploy sống, bonus kiểm tra badge của chính workflow này
        run: pytest -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t day12-agent:ci .

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5
      - name: Deploy to Railway
        run: railway up --ci --service "${{ vars.RAILWAY_SERVICE }}"
      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            curl -fsS "${{ vars.PUBLIC_URL }}/health" && exit 0
            sleep 10
          done
          exit 1
