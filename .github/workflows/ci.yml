name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run checkpoint tests (CP1–CP4)
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        # CP5 gọi vào bản deploy sống, bonus kiểm tra badge của chính workflow này
        run: pytest -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t day12-agent:ci .

  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Smoke test
        # Free tier ngủ đông + build mất vài phút → chờ tối đa ~10 phút
        run: |
          for i in $(seq 1 40); do
            curl -fsS --max-time 60 "${{ vars.PUBLIC_URL }}/health" && exit 0
            sleep 15
          done
          exit 1
